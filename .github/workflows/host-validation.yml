name: Operator validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test test/host-tools.test.mjs
      - run: node scripts/setup-local.mjs --skip-upstream
      - run: node --test test/local-skill.test.mjs test/readiness.test.mjs
      - if: runner.os == 'Windows'
        run: node --test test/portfolio.test.mjs test/app-isolation.test.mjs test/ops-learning.test.mjs
      - if: runner.os != 'Windows'
        run: npm test
  verify-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/setup-local.mjs
      - run: node scripts/operator.mjs doctor
      - run: node --input-type=module -e "import {skillCatalog} from './src/host-skills.mjs'; const rows=skillCatalog(process.cwd()); if(rows.length!==25 || rows.some(x=>!x.installed)) throw Error(JSON.stringify(rows)); console.log('All 25 skills present');"
